nt-weight:900;font-size:20px;padding:15px;cursor:pointer;box-shadow:0 3px 8px #3335}.toast{position:absolute;left:450px;top:855px;background:#54218d;color:white;padding:14px 25px;border-radius:12px;font-weight:900;font-size:22px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.tiny{position:absolute;bottom:8px;left:15px;background:#fff9;color:#48235c;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:900}
</style></head><body><div id="stage"><div id="clicks"></div><div class="panel"><div class="heading">RESULTADO DA VOTAÇÃO</div><div class="stats" id="stats"></div><div class="leader"><div class="leader-title">🏆 FRUTA EM DESTAQUE:</div><div class="leader-value" id="leader">SEM VOTOS</div></div><div class="footer"><span id="total">TOTAL: 0 VOTOS</span><button class="reset" id="reset">ZERAR VOTAÇÃO</button></div></div><button id="full" class="full">⛶ TELA CHEIA</button><div class="toast" id="toast"></div><div class="tiny">TOQUE NA FRUTA PARA VOTAR • RESULTADOS AUTOMÁTICOS</div></div><script>
(()=>{'use strict';const fruits=[{name:'MELANCIA',emoji:'🍉',color:'#ec0c27',x:102,y:413},{name:'MAÇÃ',emoji:'🍎',color:'#d40019',x:404,y:413},{name:'BANANA',emoji:'🍌',color:'#ffc400',x:703,y:413},{name:'UVA',emoji:'🍇',color:'#87109b',x:102,y:644},{name:'LARANJA',emoji:'🍊',color:'#ff7a00',x:404,y:644},{name:'MANGA',emoji:'🥭',color:'#f19a0d',x:703,y:644}];const key='feira_cores_sabores_seis_frutas_manga_v1';let votes={};try{votes=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}for(const f of fruits)votes[f.name]=Math.max(0,Math.floor(Number(votes[f.name])||0));const stage=document.getElementById('stage'),stats=document.getElementById('stats'),leader=document.getElementById('leader'),totalEl=document.getElementById('total'),toast=document.getElementById('toast');function fit(){stage.style.transform=`scale(${innerWidth/1671},${innerHeight/941})`}addEventListener('resize',fit);fit();function draw(){const total=fruits.reduce((a,f)=>a+votes[f.name],0);stats.innerHTML='';for(const f of fruits){const pct=total?Math.round(votes[f.name]*100/total):0;const row=document.createElement('div');row.className='stat';row.innerHTML=`<div class="name" style="background:${f.color}">${f.name}</div><div class="track"><div class="fill" style="background:${f.color};width:${pct}%"></div></div><div class="percent">${pct}%</div>`;stats.appendChild(row)}const top=Math.max(...fruits.map(f=>votes[f.name]));const leaders=fruits.filter(f=>votes[f.name]===top);leader.textContent=total===0?'SEM VOTOS':leaders.length===1?`${leaders[0].emoji} ${leaders[0].name}`:'🏆 EMPATE';totalEl.textContent=`TOTAL: ${total} ${total===1?'VOTO':'VOTOS'}`;}let timer;function vote(name){votes[name]++;try{localStorage.setItem(key,JSON.stringify(votes))}catch(e){alert('NÃO FOI POSSÍVEL SALVAR OS VOTOS')}draw();toast.textContent=`✓ VOTO REGISTRADO: ${name}`;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1000)}for(const f of fruits){const btn=document.createElement('button');btn.className='tap';btn.style.left=f.x+'px';btn.style.top=f.y+'px';btn.style.width='291px';btn.style.height='225px';btn.setAttribute('aria-label','VOTAR EM '+f.name);btn.addEventListener('click',()=>vote(f.name));document.getElementById('clicks').appendChild(btn)}document.getElementById('reset').onclick=()=>{if(confirm('DESEJA APAGAR TODOS OS VOTOS DESTA LOUSA?')){for(const f of fruits)votes[f.name]=0;localStorage.setItem(key,JSON.stringify(votes));draw()}};const fs=document.getElementById('full');fs.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){alert('O CHROME DESTA LOUSA NÃO PERMITIU TELA CHEIA.')}};document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'⤢ SAIR DA TELA CHEIA':'⛶ TELA CHEIA';fit()});draw()})();
</script></body></html>
