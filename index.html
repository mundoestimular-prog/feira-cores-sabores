(()=>{'use strict';const fruits=[{name:'MELANCIA',emoji:'🍉',color:'#e8192e'},{name:'MAÇÃ',emoji:'🍎',color:'#d40019'},{name:'BANANA',emoji:'🍌',color:'#ffc400'},{name:'UVA',emoji:'🍇',color:'#87109b'},{name:'LARANJA',emoji:'🍊',color:'#ff7a00'},{name:'MANGA',emoji:'🥭',color:'#f19a0d'}];const key='feira_cores_sabores_seis_frutas_manga_v1';let votes={};try{votes=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}for(const f of fruits)votes[f.name]=Math.max(0,Math.floor(Number(votes[f.name])||0));const stage=document.getElementById('stage'),stats=document.getElementById('stats'),leader=document.getElementById('leader'),totalEl=document.getElementById('total'),toast=document.getElementById('toast');function fit(){const w=document.documentElement.clientWidth||innerWidth;const h=document.documentElement.clientHeight||innerHeight;const sx=w/1672;const sy=h/941;stage.style.transform=`scale(${sx},${sy})`;stage.style.left='0px';stage.style.top='0px'}addEventListener('resize',fit);fit();function draw(){const total=fruits.reduce((a,f)=>a+votes[f.name],0);stats.innerHTML='';for(const f of fruits){const pct=total?Math.round(votes[f.name]*100/total):0;const row=document.createElement('div');row.className='stat';row.innerHTML=`<div class="fruit-name" style="background:${f.color}">${f.name}</div><div class="track"><div class="fill" style="background:${f.color};width:${pct}%"></div></div><div class="count" aria-label="${votes[f.name]} votos"><small>VOTOS</small>${votes[f.name]}</div><div class="percent">${pct}%</div>`;stats.appendChild(row)}const top=Math.max(...fruits.map(f=>votes[f.name]));const leaders=fruits.filter(f=>votes[f.name]===top);leader.innerHTML=total===0?'<span>⭐</span> SEM VOTOS':leaders.length===1?`<span>${leaders[0].emoji}</span>${leaders[0].name}`:'<span>🏆</span> EMPATE';totalEl.textContent=`TOTAL: ${total} ${total===1?'VOTO':'VOTOS'}`;}let toastTimer;function vote(name){votes[name]++;try{localStorage.setItem(key,JSON.stringify(votes))}catch(e){alert('NÃO FOI POSSÍVEL SALVAR OS VOTOS NESTE NAVEGADOR.')}draw();toast.textContent=`✓ VOTO REGISTRADO: ${name}`;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1100)}const fsButton=document.getElementById('fullScreenToggle');fsButton.addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen({navigationUI:'hide'})}}catch(e){alert('O CHROME DESTA LOUSA NÃO PERMITIU TELA CHEIA. A BARRA DO NAVEGADOR NÃO PODE SER OCULTADA PELO SITE NESTE DISPOSITIVO.')}});document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;fsButton.textContent=active?'⤢ SAIR DA TELA CHEIA':'⛶ TELA CHEIA';fsButton.setAttribute('aria-label',active?'SAIR DA TELA CHEIA':'ATIVAR TELA CHEIA');fit()});const buttons=document.getElementById('buttons');for(const f of fruits){const btn=document.createElement('button');btn.className='tap';btn.type='button';btn.dataset.fruit=f.name;btn.setAttribute('aria-label',`VOTAR EM ${f.name}`);btn.addEventListener('click',()=>vote(f.name));buttons.appendChild(btn)}document.getElementById('reset').addEventListener('click',()=>{if(confirm('ATENÇÃO: DESEJA APAGAR TODOS OS VOTOS DESTA LOUSA?')){for(const f of fruits)votes[f.name]=0;localStorage.setItem(key,JSON.stringify(votes));draw()}});draw();})();
